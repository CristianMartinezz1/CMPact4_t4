spring.application.name=cmpact4_t4
# Actividad 4: puerto nuevo (Act1 = 8081, Act2 = 8082, Act3 = 8083)
server.port=8084

# Base de datos MySQL: los valores reales llegan por variables de entorno
# (DB_URL, DB_USER, DB_PASSWORD); lo que va despues de ":" es solo para pruebas en local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cmpact4_t4?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:cmpact4}
spring.datasource.password=${DB_PASSWORD:cmpact4_local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: clave para firmar los tokens (minimo 32 caracteres) y duracion del token.
# En el VPS se define JWT_SECRET con una clave propia; esta es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cmpact4-t4-cambiar}
app.jwt.expiracion-segundos=${JWT_EXPIRACION:3600}

# API pura: errores siempre en JSON, sin pagina de error HTML
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
